name: Flutter and Android CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.7'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze
      - name: Run Dart tests
        run: flutter test
      - name: Generate API documentation
        run: dart doc
      - name: Validate package publication
        run: dart pub publish --dry-run
      - name: Create Android example host
        run: flutter create --platforms=android --project-name kryvon_example example
      - name: Add local Kryvon plugin dependency
        working-directory: example
        run: flutter pub add kryvon --path ..
      - name: Pin example to compatible Android tooling
        run: |
          sed -i 's/gradle-8\.12/gradle-8.14/' example/android/gradle/wrapper/gradle-wrapper.properties
          sed -i 's/id("com.android.application") version "[^"]*"/id("com.android.application") version "8.11.1"/' example/android/settings.gradle.kts
          sed -i 's/id("org.jetbrains.kotlin.android") version "[^"]*"/id("org.jetbrains.kotlin.android") version "2.2.20"/' example/android/settings.gradle.kts
      - name: Build Android example
        working-directory: example
        run: flutter build apk --debug
      - name: Run Android native unit tests
        working-directory: example/android
        run: ./gradlew :kryvon:testDebugUnitTest
