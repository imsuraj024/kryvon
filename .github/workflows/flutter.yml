name: Flutter CI

on:
  push:
    branches:
      - main
      - kryvon-rebuild
      - kryvon-orchestration
      - kryvon-core-hardening
      - kryvon-assessment-rules
  pull_request:
    branches:
      - main
      - kryvon-rebuild
      - kryvon-orchestration
      - kryvon-contracts
      - kryvon-core-hardening

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Run tests
        run: flutter test
