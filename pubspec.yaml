name: kryvon
description: "Runtime security assessment and policy engine for Flutter apps with Android signal detection."
version: 0.4.0
homepage: https://github.com/imsuraj024/kryvon
repository: https://github.com/imsuraj024/kryvon
issue_tracker: https://github.com/imsuraj024/kryvon/issues
topics:
  - security
  - security-tools
  - flutter-plugin

environment:
  sdk: ^3.9.2
  flutter: '>=3.35.7'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.kryvon.kryvon
        pluginClass: KryvonPlugin
